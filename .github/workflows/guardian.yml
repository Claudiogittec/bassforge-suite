name: BassForge Engineering Guardian

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Modular Build Parity
        run: node scripts/build.js --check

      - name: Run BassForge Engineering Guardian Gate
        run: node tests/guardian.test.js
